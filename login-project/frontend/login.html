<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to your account">
    <title>Sign In | Login Project</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <main class="page-shell">
        <section class="login-panel" aria-labelledby="login-title">
            <a class="back-link" href="index.html">← Home</a>
            <p class="eyebrow">ACCOUNT ACCESS</p>
            <h1 id="login-title">Welcome back</h1>
            <p class="intro">Enter your details to sign in.</p>

            <form id="login-form">
                <label for="email">Email address</label>
                <input id="email" name="email" type="email" autocomplete="email" required>

                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>

                <button class="button-link" type="submit">Sign in</button>
                <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>
</body>
</html>
